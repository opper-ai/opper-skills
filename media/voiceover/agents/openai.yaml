interface:
  display_name: "Voiceover"
  short_description: "A script in a voice you pick"
  default_prompt: "Write and voice a 20-second radio ad for a bakery. Let me pick from three voices."
dependencies:
  tools:
    - type: "mcp"
      value: "opper-media"
      description: "Opper Media: image, video, speech and transcription tools"
      transport: "streamable_http"
      url: "https://api.opper.ai/mcp/media-chatgpt"
